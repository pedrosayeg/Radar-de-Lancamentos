    excluir_url: "/(camiseta|ecobag|sacola|caneca|poster|cartaz|bolsa|bandeira|carimbo|caderno|agenda|luminaria|kit|combo|box|vale-presente|contato|livraria|colecoes|clube|sobre|quem-somos|imprensa|faq|privacidade|termos|trocas|loja|customer|checkout)"

  - nome: Editora 34
